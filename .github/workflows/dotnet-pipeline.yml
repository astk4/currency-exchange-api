name: Build -> Lint -> Test -> Slack Notify

on:
  push:
    branches:
      - development
    pull_request:
      - main

env:
  DOTNET_VERSION: '8.0'
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            **/net8.0

  lint:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Lint
        run: dotnet format --verify-no-changes

  unit-test:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres: &postgres_config
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.PG_DB_PASSWORD }}
          POSTGRES_DB: CurrencyExchangePracticeTEST
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
    
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Fill configuration files
        run: |
          ./.github/scripts/fill_in_config.sh CurrencyExchangeApiTest/bin/Release/net8.0
        env: &test_env
          PG_DB_PASSWORD: ${{ secrets.PG_DB_PASSWORD }}
          CURRENCY_DATA_API_KEY: ${{ secrets.CURRENCY_DATA_API_KEY }}
          EXCHANGE_RATE_API_KEY: ${{ secrets.EXCHANGE_RATE_API_KEY }}

      - name: Add tables into test database
        run: psql -h localhost -p 5432 -U postgres -d CurrencyExchangePracticeTEST -f CurrencyExchangeAPI/create_tables.sql
        env:
          PGPASSWORD: ${{ secrets.PG_DB_PASSWORD }}

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release --filter FullyQualifiedName~CurrencyExchangeApiTest.Unit --verbosity normal

  integration-test-short:
    needs: lint
    runs-on: ubuntu-latest

    services:
      postgres: *postgres_config

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Fill configuration files
        run: |
          ./.github/scripts/fill_in_config.sh CurrencyExchangeApiTest/bin/Release/net8.0
        env: *test_env

      - name: Add tables into test database
        run: psql -h localhost -p 5432 -U postgres -d CurrencyExchangePracticeTEST -f CurrencyExchangeAPI/create_tables.sql
        env:
          PGPASSWORD: ${{ secrets.PG_DB_PASSWORD }}

      - name: Run short integration tests
        run: dotnet test --no-build --configuration Release --filter "FullyQualifiedName~CurrencyExchangeApiTest.Integration&FullyQualifiedName!~RefreshBackgroundServiceTest" --verbosity normal

  integration-test-long:
    needs: integration-test-short
    runs-on: ubuntu-latest

    services:
      postgres: *postgres_config

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
    
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: release

      - name: Fill configuration files
        run: |
          ./.github/scripts/fill_in_config.sh CurrencyExchangeApiTest/bin/Release/net8.0
        env: *test_env

      - name: Add tables into test database
        run: psql -h localhost -p 5432 -U postgres -d CurrencyExchangePracticeTEST -f CurrencyExchangeAPI/create_tables.sql
        env:
          PGPASSWORD: ${{ secrets.PG_DB_PASSWORD }}

      - name: Run long integration tests
        run: dotnet test --no-build --configuration Release --filter FullyQualifiedName~CurrencyExchangeApiTest.Integration.RefreshBackgroundServiceTest --verbosity normal

  deploy:
    needs: [unit-test, integration-test-short, integration-test-long]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./CurrencyExchangeAPI

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set secrets into Fly.io app
        run: |
          flyctl secrets set Data__Postgres__Docker__ConnectionString="${{ secrets.REMOTE_DB_CONN_STRING }}" --stage
          flyctl secrets set DEFAULT_DB_NAME="${{ secrets.REMOTE_DB_DEFAULT_NAME }}" --stage
          flyctl secrets set API__OpenExchangeRates__Key="${{ secrets.CURRENCY_DATA_API_KEY }}" --stage
          flyctl secrets set API__ExchangeRateAPI__Key="${{ secrets.EXCHANGE_RATE_API_KEY }}" --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  slack_notify:
    needs: 
      - build
      - lint
      - unit-test
      - integration-test-short
      - integration-test-long
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Get short commit hash
        id: short_commit
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Get commit author name
        id: commit_author
        run: echo "AUTHOR_NAME=${{ github.event.head_commit.author.username }}" >> $GITHUB_ENV

      - name: Get commit message
        id: commit_msg
        run: echo "COMMIT_MESSAGE=${{ github.event.head_commit.message }}" >> $GITHUB_ENV

      - name: Checkout code (necessary to get scripts)
        uses: actions/checkout@v7

      - name: Get Build message
        run: |
          MESSAGE1=$( .github/scripts/simple_status_render.sh Build ${{ needs.build.result }} )

          echo "BUILD_MSG=${MESSAGE1}" >> $GITHUB_ENV

      - name: Get Lint message
        run: |
          MESSAGE2=$( .github/scripts/simple_status_render.sh Lint ${{ needs.lint.result }} )

          echo "LINT_MSG=${MESSAGE2}" >> $GITHUB_ENV

      - name: Get Unit Test message
        run: |
          MESSAGE3=$( .github/scripts/simple_status_render.sh Unit ${{ needs.unit-test.result }} )

          echo "UNIT_MSG=${MESSAGE3}" >> $GITHUB_ENV
          
      
      - name: Get Integration Test message
        run: |
          MESSAGE4="*Integration*: "

          if [[ "${{ needs.integration-test-short.result }}" == "success" && "${{ needs.integration-test-long.result }}" == "success" ]]; then
            MESSAGE4="${MESSAGE4} OK ✅"
          elif [[ "${{ needs.integration-test-short.result }}" == "failure" || "${{ needs.integration-test-long.result }}" == "failure" ]]; then
            MESSAGE4="${MESSAGE4} failed ❌ "
          else
            MESSAGE4="️skipped and/or canceled️ ⚠️"
          fi

          echo "INT_MSG=${MESSAGE4}" >> $GITHUB_ENV

      - name: Get Slack message title
        run: |
          if [[ "${{ needs.unit-test.result }}" == "success" && "${{ needs.integration-test-long.result }}" == "success" ]]; then
            TITLE="✅ *GitHub Actions Pipeline Succeeded*"
          else
            TITLE="ℹ️ *GitHub Actions Pipeline Finished*"
          fi

          echo "MSG_TITLE=${TITLE}" >> $GITHUB_ENV

      - name: Send custom JSON data to Slack workflow
        id: slack
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload-file-path: ./.github/resources/slack_message_blocks.json
          payload-templated: true