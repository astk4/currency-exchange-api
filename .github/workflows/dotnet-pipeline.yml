name: Build -> Test -> Slack Notify

on:
  push:
    branches:
      - development
    pull_request:
      - main

env:
  DOTNET_VERSION: '8.0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            **/net8.0

  test:
    needs: build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ secrets.PG_DB_PASSWORD }}
          POSTGRES_DB: CurrencyExchangePracticeTEST
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install dependencies
        run: dotnet restore

      - name: Fill configuration files
        run: |
          cd CurrencyExchangeApiTest/

          echo "writing db connection string..."
          echo -n "User ID=postgres;Password=" >> test-db-connection-string.txt
          echo -n ${{ secrets.PG_DB_PASSWORD }}  >> test-db-connection-string.txt
          echo -n ";Host=localhost;Port=5432;Database=CurrencyExchangePracticeTEST;" >> test-db-connection-string.txt

          echo "writing api 1 config (open exchange rates)"
          echo -n "API_KEY=" >> test-config-oxr.txt
          echo ${{ secrets.CURRENCY_DATA_API_KEY }} >> test-config-oxr.txt
          echo "BASE_URL=https://openexchangerates.org/api/" >> test-config-oxr.txt

          echo "writing api 2 config (exchange rates v6)"
          echo -n "API_KEY=" >> test-config-rates.txt
          echo ${{ secrets.EXCHANGE_RATE_API_KEY }} >> test-config-rates.txt
          echo "BASE_URL=https://v6.exchangerate-api.com/v6/" >> test-config-rates.txt

          cd ../

      - name: Add tables into test database
        run: psql -h localhost -p 5432 -U postgres -d CurrencyExchangePracticeTEST -f CurrencyExchangeAPI/create_tables.sql
        env:
          PGPASSWORD: ${{ secrets.PG_DB_PASSWORD }}

      - name: Run tests
        run: dotnet test --no-restore --verbosity normal

  slack_notify:
    needs: [build, test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Get short commit hash
        id: short_commit
        run: echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> $GITHUB_ENV

      - name: Get Build message
        run: |
          MESSAGE1="*Build*: "

          if [[ "${{ needs.build.result }}" == "success" ]]; then
            MESSAGE1="${MESSAGE1} OK ✅"
          elif [[ "${{ needs.build.result }}" == "failure" ]]; then
            MESSAGE1="${MESSAGE1} failed ❌ "
          else
            MESSAGE1="${MESSAGE1} ${{ needs.build.result }}⚠️"
          fi

          echo "BUILD_MSG=${MESSAGE1}" >> $GITHUB_ENV
      
      - name: Get Test message
        run: |
          MESSAGE2="*Test*: "

          if [[ "${{ needs.test.result }}" == "success" ]]; then
            MESSAGE2="${MESSAGE2} OK ✅"
          elif [[ "${{ needs.test.result }}" == "failure" ]]; then
            MESSAGE2="${MESSAGE2} failed ❌ "
          else
            MESSAGE2="${MESSAGE2} ${{ needs.test.result }}⚠️"
          fi

          echo "TEST_MSG=${MESSAGE2}" >> $GITHUB_ENV

      - name: Get Slack message title
        run: |
          if [[ "${{ needs.build.result }}" == "success" && "${{ needs.test.result }}" == "success" ]]; then
            TITLE="✅ *GitHub Actions Pipeline Succeeded*"
          else
            TITLE="ℹ️ *GitHub Actions Pipeline Finished*"
          fi

          echo "MSG_TITLE=${TITLE}" >> $GITHUB_ENV

      - name: Send custom JSON data to Slack workflow
        id: slack
        uses: slackapi/slack-github-action@v4
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ env.MSG_TITLE }}"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Repo*\n<https://github.com/${{ github.repository }}|${{ github.repository }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Commit*\n<${{ github.event.head_commit.url }}|${{ env.SHORT_SHA }}>"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Author*\n${{ github.event.head_commit.author.username }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Event Name*\n`${{ github.event_name }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Workflow*\n`${{ github.workflow }}`"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Message*\n${{ github.event.head_commit.message }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ env.BUILD_MSG }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "${{ env.TEST_MSG }}"
                    }
                  ]
                }
              ]
            }